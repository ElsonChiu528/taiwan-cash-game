<head>

<title>台灣鈔能力：三王突圍｜手機順暢版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78add5}
body{touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
#game{display:block;width:100vw;height:100dvh;position:fixed;inset:0}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff}
.panel{background:rgba(0,0,0,.62);border-radius:12px;padding:7px 10px;text-shadow:0 1px 2px #000}
#top{position:absolute;top:max(8px,env(safe-area-inset-top));left:9px;right:9px;display:flex;justify-content:space-between;gap:6px}
#title{font-size:14px;font-weight:900}#level{font-size:12px;margin-top:2px}
#stats{font-size:12px;text-align:right;line-height:1.45}
#bossbar{display:none;position:absolute;top:76px;left:12%;right:12%;background:rgba(0,0,0,.7);padding:6px 8px;border-radius:10px}
#bossName{font-size:12px;font-weight:900}.bar{height:8px;background:#431414;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#ff5b35}
#hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.7);padding:12px 16px;border-radius:14px;text-align:center;font-size:13px;line-height:1.6;transition:opacity .3s}
#message{position:absolute;top:25%;left:50%;transform:translateX(-50%);font-size:22px;font-weight:900;white-space:nowrap;text-shadow:0 2px 4px #000}
#controls{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;padding:0 10px;z-index:5}
.group{display:flex;gap:5px;pointer-events:auto}
#cardGroup{position:absolute;left:50%;transform:translateX(-50%);bottom:0}
#attack{order:3}
button{font-family:inherit;touch-action:manipulation}
.btn{width:68px;height:68px;border:1px solid rgba(255,255,255,.4);border-radius:50%;background:rgba(18,22,28,.72);color:#fff;font-size:24px;font-weight:900}
.card{width:50px;height:50px;border-radius:12px;font-size:10px}.card b{display:block;font-size:14px}
#restart{display:none;position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);pointer-events:auto;border:0;border-radius:13px;padding:12px 21px;background:#fff;color:#111;font-size:17px;font-weight:900}
</style>

<canvas id="game"></canvas>

  </div>
</div>

function buildScene(){
  scene=document.createElement("canvas");scene.width=sceneW;scene.height=Math.max(480,H||480);
  const g=scene.getContext("2d");
  const sky=g.createLinearGradient(0,0,0,ground);
  sky.addColorStop(0,"#69a8d9");sky.addColorStop(.65,"#bdd8e8");sky.addColorStop(1,"#ead8c0");
  g.fillStyle=sky;g.fillRect(0,0,sceneW,ground);

  // distant skyline — pre-rendered once, not every frame
  for(let i=0;i<18;i++){
    const x=i*130-80,h=75+(i%5)*25;
    g.fillStyle=i%3===0?"#89979e":"#9ba6aa";g.fillRect(x,ground-70-h,95,h+70);
    g.fillStyle="rgba(255,238,175,.55)";
    for(let y=ground-55-h;y<ground-90;y+=24)for(let xx=x+12;xx<x+82;xx+=22)g.fillRect(xx,y,9,8);
  }
  // Taiwan street shops
  for(let i=0;i<15;i++){
    const x=i*155;
    g.fillStyle=i%2?"#d5d0c6":"#b9c1c4";g.fillRect(x,ground-230,148,155);
    g.fillStyle=i%3?"#59636a":"#d7a45e";g.fillRect(x+8,ground-202,132,72);
    g.fillStyle="#343a3e";g.fillRect(x+15,ground-188,43,50);
    g.fillStyle="#f1ecd9";g.fillRect(x+66,ground-188,65,50);
    g.fillStyle=i%2?"#ed4b45":"#4c91bc";g.fillRect(x,ground-218,148,15);
    for(let z=0;z<7;z++){g.fillStyle=z%2?"#fff":"rgba(255,255,255,.2)";g.fillRect(x+z*22,ground-218,10,15)}
    g.fillStyle="#263039";g.font="900 12px sans-serif";g.textAlign="center";g.fillText(i%2?"便利商店":"台灣小吃",x+74,ground-158);
  }
  // sidewalk, curb and road
  g.fillStyle="#b9b09f";g.fillRect(0,ground-62,sceneW,62);
  g.fillStyle="#777";g.fillRect(0,ground-8,sceneW,8);
  g.fillStyle="#ddd";g.fillRect(0,ground-15,sceneW,7);
  g.fillStyle="#45484a";g.fillRect(0,ground,sceneW,H-ground);
  g.fillStyle="#e5d58d";
  for(let x=0;x<sceneW;x+=180)g.fillRect(x,ground+62,88,5);
  // zebra crossings
  g.fillStyle="#f4f4f4";
  for(let x=210;x<sceneW;x+=330)for(let k=0;k<8;k++)g.fillRect(x+k*18,ground-48,11,48);
  // utility poles
  for(let x=80;x<sceneW;x+=270){
    g.fillStyle="#555";g.fillRect(x,ground-300,8,240);
    g.fillStyle="#333";g.fillRect(x-28,ground-296,64,6);
    g.fillStyle="#222";g.fillRect(x-38,ground-283,84,3);
  }
  // traffic light
  g.fillStyle="#555";g.fillRect(560,ground-275,8,215);g.fillStyle="#222";g.fillRect(547,ground-270,34,82);
  g.fillStyle="#f33";g.beginPath();g.arc(564,ground-252,7,0,7);g.fill();
  g.fillStyle="#f5c84b";g.beginPath();g.arc(564,ground-227,7,0,7);g.fill();
  g.fillStyle="#37c65a";g.beginPath();g.arc(564,ground-202,7,0,7);g.fill();
  // cars and scooters
  for(let i=0;i<8;i++){
    const x=100+i*280,y=ground+24+(i%2)*54;
    g.fillStyle=i%2?"#b73535":"#d5d7d9";g.fillRect(x,y,90,30);
    g.fillStyle="#25282b";g.fillRect(x+18,y-16,50,19);
    g.fillStyle="#8fb4c8";g.fillRect(x+25,y-13,18,13);g.fillRect(x+46,y-13,18,13);
    g.fillStyle="#181818";g.beginPath();g.arc(x+18,y+30,9,0,7);g.arc(x+73,y+30,9,0,7);g.fill();
  }
  // 101 near finish
  const x=1780,y=ground-365;
  g.fillStyle="#526d7e";g.fillRect(x+32,y+120,60,245);
  for(let k=0;k<5;k++){g.fillStyle="#6f8998";g.fillRect(x+17-k*2,y+60+k*45,90+k*4,32)}
  g.fillStyle="#465e70";g.fillRect(x+52,y,20,65);
  g.fillStyle="#fff";g.font="900 22px sans-serif";g.textAlign="center";g.fillText("101",x+62,y+104);
}

let game=null;
function reset(){
  game={
    running:true,over:false,win:false,t:0,dist:0,hp:5,money:0,card:0,
    scroll:0,cool:0,spawn:40,obstacles:[],shots:[],enemyShots:[],
    boss:null,bossSpawned:false,bossIndex:0,bossDefeated:0,shake:0,
    p:{x:W*.23,y:ground-76,vy:0,onGround:true,inv:0}
  };
  document.getElementById("restart").style.display="none";
  document.getElementById("bossbar").style.display="none";
  document.getElementById("message").textContent="";
  updateUI();
}
function jump(){if(game&&game.running&&game.p.onGround){game.p.vy=-12;game.p.onGround=false}}
function fire(){
  if(!game||!game.running||game.cool>0)return;
  const c=cards[game.card];game.cool=c.cool;game.money+=5;
  game.shots.push({x:game.p.x+28,y:game.p.y+18,vx:8*c.speed,dmg:c.power});
}
function setCard(i){if(game)game.card=Math.max(0,Math.min(3,i));updateUI()}
function hit(){
  if(game.p.inv>0)return;
  game.hp--;game.p.inv=55;game.shake=5;
  if(game.hp<=0)end(false);
}
function end(win){
  if(!game.running)return;
  game.running=false;game.over=true;game.win=win;
  document.getElementById("restart").style.display="block";
  document.getElementById("message").textContent=win?"🎉 三王全部擊破！成功突圍新竹縣！":"💥 被 Boss 攔下了！";
}
function spawnObstacle(){
  const types=["cone","barrier","sign"],type=types[Math.floor(Math.random()*3)];
  const h=type==="barrier"?30:type==="sign"?52:35;
  game.obstacles.push({x:W+30,y:ground-63-h,w:type==="barrier"?65:type==="sign"?42:36,h,type});
}
function update(){
  if(!game.running)return;
  game.t++;const c=cards[game.card];
  game.dist+=.72*c.speed;game.scroll+=1.75*c.speed;
  const p=game.p;
  if(p.inv>0)p.inv--;
  p.vy+=.72;p.y+=p.vy;
  if(p.y>=ground-76){p.y=ground-76;p.vy=0;p.onGround=true}
  game.cool=Math.max(0,game.cool-1);
  game.spawn--;if(game.spawn<=0){spawnObstacle();game.spawn=75+Math.random()*55}
  for(const o of game.obstacles)o.x-=2.1*c.speed;
  for(const s of game.shots)s.x+=s.vx;
  for(const s of game.enemyShots)s.x-=s.vx;

  for(const o of game.obstacles)
    if(Math.abs(o.x-p.x)<42&&p.y+62>o.y&&p.y<o.y+o.h)hit();
  game.obstacles=game.obstacles.filter(o=>o.x>-100);
  game.shots=game.shots.filter(s=>s.x<W+100);

  const bossThreshold=game.bossDefeated===0?1450:(game.bossDefeated===1?1900:2350);
  if(!game.bossSpawned&&game.dist>=bossThreshold){
    game.bossSpawned=true;game.boss={x:W-95,y:ground-98,hp:90,max:90,cool:55,type:0};
    document.getElementById("bossbar").style.display="block";
    document.getElementById("bossName").textContent="第一王・霸王炘";
    document.getElementById("message").textContent="⚠️ 第一王・霸王炘出現！";
    setTimeout(()=>{if(game&&game.running)document.getElementById("message").textContent=""},1400);
  }
  if(game.boss){
    const b=game.boss;b.x=Math.max(W*.58,b.x-.3);b.cool--;
    for(const s of game.shots)
      if(Math.abs(s.x-b.x)<48&&Math.abs(s.y-(b.y+35))<75){b.hp-=s.dmg;s.x=W+500}
    if(b.cool<=0){
      const phase=b.hp/b.max,n=phase>.66?1:phase>.33?2:3;
      for(let i=0;i<n;i++)game.enemyShots.push({x:b.x-35,y:b.y+20+i*18,vx:4.5+i*.5});
      b.cool=Math.max(25,68*phase);
    }
    for(const s of game.enemyShots)
      if(Math.abs(s.x-p.x)<35&&Math.abs(s.y-(p.y+30))<44){hit();s.x=-500}
    game.enemyShots=game.enemyShots.filter(s=>s.x>-100);
    if(b.hp<=0){
      game.bossDefeated++;
      if(game.bossDefeated>=3){ end(true); }
      else {
        const next=game.bossDefeated;
        game.boss=null;
        game.bossSpawned=false;
        game.dist=next===1?1900:2350;
        game.scroll=0;
        document.getElementById("bossbar").style.display="none";
        document.getElementById("message").textContent=next===1?"🔥 第二關・桃園市！色色榮登場！":"🌬️ 第三關・新竹縣！帥氣濱登場！";
        setTimeout(()=>{
          if(game&&game.running){
            game.bossSpawned=true;
            game.boss={x:W-95,y:ground-98,hp:next===1?110:140,max:next===1?110:140,cool:55,type:next};
            document.getElementById("bossbar").style.display="block";
            document.getElementById("bossName").textContent=next===1?"第二王・色色榮":"第三王・帥氣濱";
            document.getElementById("message").textContent="";
          }
        },900);
      }
    }
  }
  updateUI();
}
function updateUI(){
  if(!game)return;
  document.getElementById("hp").textContent=game.hp;
  document.getElementById("money").textContent=Math.floor(game.money);
  document.getElementById("card").textContent=cards[game.card].name;
  document.getElementById("distance").textContent=Math.floor(game.dist);
  const stageNames=["第一關・信義路","第二關・桃園市","第三關・新竹縣"];
  document.getElementById("level").textContent=stageNames[Math.min(2,game.bossDefeated)];
  if(game.boss) document.getElementById("bossHp").style.width=Math.max(0,game.boss.hp/game.boss.max*100)+"%";
}

function drawPlayer(){
  const p=game.p,x=p.x,y=p.y;
  ctx.save();ctx.translate(x,y);
  // soft shadow
  ctx.fillStyle="rgba(0,0,0,.24)";ctx.beginPath();ctx.ellipse(0,74,27,7,0,0,7);ctx.fill();
  // running pose
  const a=Math.sin(game.t*.34), b=Math.sin(game.t*.34+Math.PI);
  // legs: dark trousers + sneakers
  ctx.strokeStyle="#202936";ctx.lineWidth=9;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(-6,47);ctx.lineTo(-16+a*10,69);ctx.lineTo(-25+a*10,72);ctx.moveTo(6,47);ctx.lineTo(16+b*10,69);ctx.lineTo(26+b*10,72);ctx.stroke();
  ctx.fillStyle="#f7f7f7";
  ctx.beginPath();ctx.ellipse(-25+a*10,72,9,4,0,0,7);ctx.ellipse(26+b*10,72,9,4,0,0,7);ctx.fill();
  // blue hoodie/shirt with collar
  ctx.fillStyle="#2463e8";ctx.beginPath();ctx.roundRect(-18,17,36,34,8);ctx.fill();
  ctx.fillStyle="#174dbd";ctx.beginPath();ctx.moveTo(-8,17);ctx.lineTo(0,28);ctx.lineTo(8,17);ctx.closePath();ctx.fill();
  // back arm
  ctx.strokeStyle="#e8b88d";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-13,25);ctx.lineTo(-29,43);ctx.lineTo(-39,37);ctx.stroke();
  // front arm holding cash
  ctx.beginPath();ctx.moveTo(13,25);ctx.lineTo(31,11);ctx.lineTo(42,2);ctx.stroke();
  // hand
  ctx.fillStyle="#e8b88d";ctx.beginPath();ctx.arc(42,2,5,0,7);ctx.fill();
  // banknote
  ctx.save();ctx.translate(43,-2);ctx.rotate(-.12);
  ctx.fillStyle="#d9f0c8";ctx.strokeStyle="#4d9b62";ctx.lineWidth=2;ctx.roundRect(-2,-10,39,23,3);ctx.fill();ctx.stroke();
  ctx.fillStyle="#39844e";ctx.font="900 16px sans-serif";ctx.textAlign="center";ctx.fillText("$",17,8);ctx.restore();
  // neck
  ctx.fillStyle="#e8b88d";ctx.fillRect(-5,10,10,9);
  // head
  ctx.fillStyle="#f1c39a";ctx.beginPath();ctx.arc(0,1,17,0,7);ctx.fill();
  // ears
  ctx.beginPath();ctx.arc(-16,3,4,0,7);ctx.arc(16,3,4,0,7);ctx.fill();
  // hair, swept fringe
  ctx.fillStyle="#20252b";ctx.beginPath();
  ctx.moveTo(-17,-1);ctx.quadraticCurveTo(-15,-19,1,-19);ctx.quadraticCurveTo(17,-18,18,-3);
  ctx.quadraticCurveTo(10,-9,3,-4);ctx.quadraticCurveTo(-3,-1,-10,-5);ctx.quadraticCurveTo(-13,0,-17,-1);ctx.closePath();ctx.fill();
  // face details, friendly but minimal
  ctx.fillStyle="#2b2522";ctx.beginPath();ctx.arc(-6,3,1.5,0,7);ctx.arc(6,3,1.5,0,7);ctx.fill();
  ctx.strokeStyle="#9a5d50";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,7,4,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
  // small backpack
  ctx.fillStyle="#183e87";ctx.roundRect(-25,22,8,25,4);ctx.fill();
  ctx.restore();
}
function drawBoss(){
  if(!game.boss)return;
  const b=game.boss,x=b.x,y=b.y;
  ctx.save();
  if(b.type===0){
    ctx.fillStyle="rgba(120,0,0,.18)";ctx.beginPath();ctx.arc(x,y+35,72,0,7);ctx.fill();
    ctx.fillStyle="#8d1f2d";ctx.beginPath();ctx.roundRect(x-36,y+24,72,60,8);ctx.fill();
    ctx.fillStyle="#f0bd94";ctx.beginPath();ctx.arc(x,y+7,29,0,7);ctx.fill();
    ctx.fillStyle="#1a1a1a";ctx.beginPath();ctx.arc(x,y-1,30,Math.PI,2*Math.PI);ctx.fill();
    ctx.fillStyle="#f5d04a";ctx.fillRect(x-30,y+52,60,25);
  } else if(b.type===1){
    // 色色榮：胖胖、黑髮、眼鏡、白色上衣、藍白拖；搞笑反派感
    ctx.fillStyle="rgba(120,30,30,.15)";ctx.beginPath();ctx.ellipse(x,y+83,62,10,0,0,7);ctx.fill();
    ctx.fillStyle="#f0bd94";ctx.beginPath();ctx.ellipse(x,y+48,50,42,0,0,7);ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.roundRect(x-38,y+33,76,54,18);ctx.fill();
    ctx.fillStyle="#f0bd94";ctx.beginPath();ctx.arc(x,y-2,32,0,7);ctx.fill();
    ctx.fillStyle="#171717";ctx.beginPath();ctx.arc(x,y-10,33,Math.PI,2*Math.PI);ctx.fill();
    // glasses
    ctx.strokeStyle="#171717";ctx.lineWidth=4;ctx.strokeRect(x-27,y-7,22,15);ctx.strokeRect(x+5,y-7,22,15);ctx.beginPath();ctx.moveTo(x-5,y);ctx.lineTo(x+5,y);ctx.stroke();
    // cheeky smile
    ctx.strokeStyle="#7d342d";ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y+7,12,.1*Math.PI,.9*Math.PI);ctx.stroke();
    // blue-white slides
    ctx.fillStyle="#2e6fd6";ctx.roundRect(x-48,y+78,38,12,7);ctx.roundRect(x+10,y+78,38,12,7);ctx.fill();
    ctx.fillStyle="#fff";ctx.fillRect(x-40,y+78,22,5);ctx.fillRect(x+18,y+78,22,5);
  } else {
    // 帥氣濱：高挑美男子、黑髮、黑西裝，偶像劇 Boss 氣場
    ctx.fillStyle="rgba(0,0,0,.18)";ctx.beginPath();ctx.ellipse(x,y+90,46,8,0,0,7);ctx.fill();
    // coat
    ctx.fillStyle="#15171c";ctx.beginPath();ctx.roundRect(x-34,y+28,68,62,10);ctx.fill();
    ctx.fillStyle="#f4f4f2";ctx.beginPath();ctx.moveTo(x-13,y+29);ctx.lineTo(x,y+48);ctx.lineTo(x+13,y+29);ctx.lineTo(x+10,y+70);ctx.lineTo(x,y+58);ctx.lineTo(x-10,y+70);ctx.closePath();ctx.fill();
    // neck + face
    ctx.fillStyle="#e8b58e";ctx.fillRect(x-7,y+15,14,17);ctx.beginPath();ctx.arc(x,y+3,25,0,7);ctx.fill();
    // hair
    ctx.fillStyle="#101216";ctx.beginPath();ctx.moveTo(x-25,y+4);ctx.quadraticCurveTo(x-24,y-25,x,y-29);ctx.quadraticCurveTo(x+27,y-24,x+25,y+2);ctx.quadraticCurveTo(x+10,y-8,x+2,y-15);ctx.quadraticCurveTo(x-7,y-5,x-25,y+4);ctx.fill();
    // eyes
    ctx.fillStyle="#20252b";ctx.beginPath();ctx.ellipse(x-9,y+3,3,2,0,0,7);ctx.ellipse(x+9,y+3,3,2,0,0,7);ctx.fill();
    ctx.strokeStyle="#a35f59";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y+10,7,.15*Math.PI,.85*Math.PI);ctx.stroke();
    // trousers + shoes
    ctx.fillStyle="#0d0f13";ctx.fillRect(x-30,y+78,27,12);ctx.fillRect(x+3,y+78,27,12);
    ctx.fillStyle="#111";ctx.beginPath();ctx.ellipse(x-19,y+91,16,6,0,0,7);ctx.ellipse(x+19,y+91,16,6,0,0,7);ctx.fill();
    // rose
    ctx.fillStyle="#b51f35";ctx.beginPath();ctx.arc(x+35,y+35,7,0,7);ctx.fill();ctx.strokeStyle="#3b7a45";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+35,y+42,x+29,y+58);ctx.stroke();
  }
  ctx.restore();
}
function draw(){
  if(!game)return;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle="#78add5";ctx.fillRect(0,0,W,H);
  if(game.bossDefeated>=2 && hsinchuStage3.complete && hsinchuStage3.naturalWidth){
    // 圖片已裁切到道路約落在遊戲 60% 地面線，並水平循環。
    const iw=hsinchuStage3.naturalWidth, ih=hsinchuStage3.naturalHeight;
    const viewW=Math.max(1,Math.min(iw,iw*W/sceneW));
    const sx=((game.scroll*0.72)%iw+iw)%iw;
    const drawSlice=Math.min(viewW,iw-sx);
    ctx.drawImage(hsinchuStage3,sx,0,drawSlice,ih,0,0,W*drawSlice/viewW,H);
    if(drawSlice<viewW)ctx.drawImage(hsinchuStage3,0,0,viewW-drawSlice,ih,W*drawSlice/viewW,0,W*(viewW-drawSlice)/viewW,H);
  } else if(scene && scene.width>0 && scene.height>0){
    const sx=((game.scroll%sceneW)+sceneW)%sceneW;
    const sw=Math.min(W,sceneW-sx);
    ctx.drawImage(scene,sx,0,sw,H,0,0,sw,H);
    if(sw<W)ctx.drawImage(scene,0,0,W-sw,H,sw,0,W-sw,H);
  }else{
    ctx.fillStyle="#78add5";ctx.fillRect(0,0,W,ground);
    ctx.fillStyle="#b9b09f";ctx.fillRect(0,ground-62,W,62);
    ctx.fillStyle="#45484a";ctx.fillRect(0,ground,W,H-ground);
  }
  for(const o of game.obstacles){
    ctx.fillStyle=o.type==="cone"?"#f47b20":o.type==="barrier"?"#e84b3c":"#30343a";
    if(o.type==="cone"){ctx.beginPath();ctx.moveTo(o.x,o.y+35);ctx.lineTo(o.x+18,o.y-4);ctx.lineTo(o.x+36,o.y+35);ctx.closePath();ctx.fill()}
    else ctx.fillRect(o.x,o.y,o.w,o.h);
  }
  for(const s of game.shots){ctx.fillStyle=game.card===3?"#222":"#f5f0d4";ctx.fillRect(s.x,s.y,32,14);ctx.strokeStyle="#2f8a55";ctx.strokeRect(s.x,s.y,32,14)}
  for(const s of game.enemyShots){ctx.fillStyle="#ff4735";ctx.beginPath();ctx.arc(s.x,s.y,7,0,7);ctx.fill()}
  drawBoss();
  if(!game.p.inv||Math.floor(game.p.inv/6)%2)drawPlayer();
}
function loop(){
  const now=performance.now();
  if(!loop.last)loop.last=now;
  const dt=Math.min(50,now-loop.last);loop.last=now;
  loop.acc=(loop.acc||0)+dt;
  while(loop.acc>=16.67){update();loop.acc-=16.67}
  draw();requestAnimationFrame(loop);
}

document.getElementById("jump").onclick=jump;
document.getElementById("attack").onclick=fire;
document.querySelectorAll(".card").forEach(b=>b.onclick=()=>setCard(+b.dataset.card));
document.getElementById("restart").onclick=()=>{reset();loop.last=performance.now();loop.acc=0};
addEventListener("keydown",e=>{
  if(e.code==="Space"||e.code==="ArrowUp")jump();
  if(e.code==="ArrowRight"||e.code==="KeyF")fire();
  if(/^[1-4]$/.test(e.key))setCard(+e.key-1);
});

resize();reset();
addEventListener("orientationchange",()=>setTimeout(resize,150));
addEventListener("pageshow",()=>setTimeout(resize,50));
setTimeout(()=>document.getElementById("hint").style.opacity="0",4200);
requestAnimationFrame(loop);
</script>
