<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>台灣鈔能力：三王突圍</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78add5}
body{touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff}
.panel{background:rgba(0,0,0,.62);border-radius:12px;padding:7px 10px;text-shadow:0 1px 2px #000}
#top{position:absolute;top:max(8px,env(safe-area-inset-top));left:9px;right:9px;display:flex;justify-content:space-between;gap:6px}
#title{font-size:14px;font-weight:900}#level{font-size:12px;margin-top:2px}
#stats{font-size:12px;text-align:right;line-height:1.45}
#hint{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);background:rgba(0,0,0,.72);padding:12px 16px;border-radius:14px;text-align:center;font-size:13px;line-height:1.6;transition:opacity .3s}
#message{position:absolute;top:25%;left:50%;transform:translateX(-50%);font-size:22px;font-weight:900;white-space:nowrap;text-shadow:0 2px 4px #000}
#controls{position:absolute;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;padding:0 10px;z-index:5}
.group{display:flex;gap:5px;pointer-events:auto}
#cardGroup{position:absolute;left:50%;transform:translateX(-50%);bottom:0}
.btn{width:68px;height:68px;border:1px solid rgba(255,255,255,.4);border-radius:50%;background:rgba(18,22,28,.78);color:#fff;font-size:24px;font-weight:900}
.card{width:50px;height:50px;border-radius:12px;font-size:10px}.card b{display:block;font-size:14px}
#restart{display:none;position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);pointer-events:auto;border:0;border-radius:13px;padding:12px 21px;background:#fff;color:#111;font-size:17px;font-weight:900}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="top">
    <div class="panel"><div id="title">🇹🇼 台灣鈔能力：信義區突圍</div><div id="level">第一關・信義路</div></div>
    <div class="panel" id="stats">❤️ <span id="hp">5</span>　💰 <span id="money">0</span><br>🃏 <span id="card">普卡</span>　📍 <span id="distance">0</span>m</div>
  </div>
  <div id="hint">點一下畫面開始<br>↟ 跳躍　💴 出錢攻擊<br>下方四張卡可切換鈔能力</div>
  <div id="message"></div>
  <button id="restart">重新開始</button>
  <div id="controls">
    <div class="group"><button class="btn" id="jump">↟</button></div>
    <div class="group" id="cardGroup">
      <button class="btn card" data-card="0"><b>普</b>普卡</button>
      <button class="btn card" data-card="1"><b>金</b>金卡</button>
      <button class="btn card" data-card="2"><b>白</b>白金卡</button>
      <button class="btn card" data-card="3"><b>黑</b>黑卡</button>
    </div>
    <div class="group"><button class="btn" id="attack">💴</button></div>
  </div>
</div>
<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W,H,ground,raf,last=0,started=false,over=false,win=false;
let level=1, distance=0, money=0, hp=5, selected=0, cooldown=0, world=0;
const cards=[
 {name:"普卡",power:1,cool:420,speed:1},
 {name:"金卡",power:1.7,cool:330,speed:1.06},
 {name:"白金卡",power:2.5,cool:260,speed:1.12},
 {name:"黑卡",power:4,cool:190,speed:1.2}
];
const p={x:0,y:0,w:44,h:72,vy:0,onGround:true};
let obstacles=[],coins=[],shots=[],boss=null;

function resize(){
 W=Math.max(320,innerWidth); H=Math.max(480,innerHeight); ground=H*.60;
 canvas.width=W; canvas.height=H; resetPlayer(); draw();
}
addEventListener("resize",resize);

function resetPlayer(){p.x=W*.23;p.y=ground-p.h;p.vy=0;p.onGround=true}
function resetGame(){
 level=1;distance=0;money=0;hp=5;selected=0;cooldown=0;world=0;over=false;win=false;started=false;
 obstacles=[];coins=[];shots=[];boss=null;resetPlayer();
 document.getElementById("hint").style.opacity=1;
 document.getElementById("restart").style.display="none";
 document.getElementById("message").textContent="";
 updateUI(); draw();
}
function start(){if(over)return;started=true;document.getElementById("hint").style.opacity=0;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function jump(){
 if(!started)start();
 if(p.onGround){p.vy=-760;p.onGround=false}
}
function attack(){
 if(!started)start();
 if(cooldown>0)return;
 const c=cards[selected];cooldown=c.cool;
 shots.push({x:p.x+p.w,y:p.y+28,vx:8*c.power,life:1,power:c.power});
}
function setCard(i){selected=i;document.getElementById("card").textContent=cards[i].name}
function spawn(){
 const r=Math.random();
 if(r<.42) coins.push({x:W+30,y:ground-90-Math.random()*120,r:13});
 else obstacles.push({x:W+30,y:ground-42,w:32+Math.random()*25,h:42+Math.random()*22});
}
let spawnT=0;
function update(dt){
 const speed=240*cards[selected].speed;
 world+=speed*dt; distance=Math.floor(world/10);
 cooldown=Math.max(0,cooldown-dt*1000);
 p.vy+=1850*dt;p.y+=p.vy*dt;
 if(p.y+p.h>=ground){p.y=ground-p.h;p.vy=0;p.onGround=true}
 spawnT-=dt;
 if(spawnT<=0){spawn();spawnT=.75+Math.random()*.65}
 obstacles.forEach(o=>o.x-=speed*dt);
 coins.forEach(c=>c.x-=speed*dt);
 shots.forEach(s=>{s.x+=s.vx*60*dt;s.life-=dt});
 obstacles=obstacles.filter(o=>o.x>-80);
 coins=coins.filter(c=>c.x>-40);
 shots=shots.filter(s=>s.life>0&&s.x<W+80);

 for(const o of obstacles){
   if(o.x<p.x+p.w-7&&o.x+o.w>p.x+7&&p.y+p.h>o.y+4&&p.y<o.y+o.h){
     if(!p.inv){hp--;p.inv=true;setTimeout(()=>p.inv=false,700)}
     o.x=-200;
   }
 }
 for(const c of coins){
   if(Math.hypot(c.x-(p.x+p.w/2),c.y-(p.y+35))<42){money+=10;c.x=-100}
 }
 if(distance>450&&level===1){level=2;world=0;distance=0;show("第二關・桃園市")}
 if(distance>450&&level===2){level=3;world=0;distance=0;show("第三關・新竹縣")}
 if(distance>450&&level===3){level=4;world=0;distance=0;boss={x:W+100,hp:30,max:30};show("王關・三王突圍")}
 if(level===4) updateBoss(dt);
 if(hp<=0){over=true;show("挑戰失敗");document.getElementById("restart").style.display="block"}
 updateUI();
}
function updateBoss(dt){
 const speed=130;
 if(boss){boss.x-=speed*dt;if(boss.x<W*.72)boss.x=W*.72;
  for(const s of shots){
   if(Math.abs(s.x-boss.x)<55){boss.hp-=s.power; s.life=0}
  }
  if(boss.hp<=0){win=true;over=true;show("🎉 三王突圍成功！");document.getElementById("restart").style.display="block"}
 }
}
function show(t){document.getElementById("message").textContent=t;setTimeout(()=>{if(!over)document.getElementById("message").textContent=""},1400)}
function updateUI(){
 document.getElementById("hp").textContent=hp;
 document.getElementById("money").textContent=money;
 document.getElementById("distance").textContent=distance;
 document.getElementById("card").textContent=cards[selected].name;
 const names=["第一關・信義路","第二關・桃園市","第三關・新竹縣","王關・三王突圍"];
 document.getElementById("level").textContent=names[level-1];
}
function draw(){
 ctx.clearRect(0,0,W,H);
 // sky / background
 const grad=ctx.createLinearGradient(0,0,0,ground);
 grad.addColorStop(0,"#78add5");grad.addColorStop(1,"#dceef7");ctx.fillStyle=grad;ctx.fillRect(0,0,W,ground);
 drawCity();
 // sidewalk
 ctx.fillStyle="#bfc0bd";ctx.fillRect(0,ground,W,H-ground);
 for(let x=-((world/2)%70);x<W;x+=70){ctx.fillStyle="#e9e9e7";ctx.fillRect(x,ground,34,80)}
 // road
 ctx.fillStyle="#4c5862";ctx.fillRect(0,ground+82,W,H-ground-82);
 ctx.fillStyle="#eee";for(let x=-((world)%370);x<W;x+=370)ctx.fillRect(x,ground+300,180,14);
 obstacles.forEach(drawObstacle);coins.forEach(drawCoin);shots.forEach(drawShot);
 drawPlayer();
 if(boss)drawBoss();
}
function drawCity(){
 const colors=["#b8d1df","#d6e1e5","#a9c5d3","#dfe9ed"];
 for(let i=0;i<9;i++){let bw=75+(i%3)*35,bx=i*95-(world*.08%95);let bh=180+(i%4)*55;
  ctx.fillStyle=colors[i%colors.length];ctx.fillRect(bx,ground-bh,bw,bh);
  for(let y=ground-bh+20;y<ground-20;y+=35)for(let x=bx+10;x<bx+bw-8;x+=28){ctx.fillStyle="#76b4dc";ctx.fillRect(x,y,17,21)}
 }
 // trees
 for(let i=0;i<7;i++){let x=i*130-(world*.18%130)+35;ctx.fillStyle="#6a4730";ctx.fillRect(x,ground-145,10,145);ctx.fillStyle="#35a84a";ctx.beginPath();ctx.arc(x+5,ground-165,45,0,Math.PI*2);ctx.fill()}
 // stage signs
 ctx.fillStyle="rgba(20,55,90,.85)";ctx.fillRect(W*.08,ground-220,W*.42,62);
 ctx.fillStyle="#fff";ctx.font="bold 25px sans-serif";ctx.fillText(level===1?"信義路":level===2?"桃園市":level===3?"新竹縣":"王關",W*.11,ground-180);
}
function drawPlayer(){
 const x=p.x,y=p.y;
 if(p.inv&&Math.floor(performance.now()/100)%2===0)return;
 ctx.fillStyle="#f1b58b";ctx.beginPath();ctx.arc(x+22,y+17,18,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#1f2933";ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x+13,y+48);ctx.lineTo(x+5,y+70);ctx.moveTo(x+30,y+48);ctx.lineTo(x+40,y+70);ctx.stroke();
 ctx.fillStyle="#2463e8";ctx.fillRect(x+4,y+32,36,30);
 ctx.strokeStyle="#f1b58b";ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x+34,y+39);ctx.lineTo(x+58,y+25);ctx.stroke();
}
function drawObstacle(o){ctx.fillStyle="#29323a";ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillStyle="#e9b949";ctx.fillRect(o.x+5,o.y+7,o.w-10,7)}
function drawCoin(c){ctx.fillStyle="#d9efb8";ctx.fillRect(c.x-22,c.y-15,44,30);ctx.fillStyle="#36884c";ctx.font="bold 24px sans-serif";ctx.fillText("$",c.x-8,c.y+9)}
function drawShot(s){ctx.fillStyle="#fff1a8";ctx.fillRect(s.x,s.y,30,12);ctx.fillStyle="#278b52";ctx.font="bold 15px sans-serif";ctx.fillText("$",s.x+8,s.y+10)}
function drawBoss(){ctx.fillStyle="#7b2d2d";ctx.fillRect(boss.x,ground-120,75,120);ctx.fillStyle="#f1b58b";ctx.beginPath();ctx.arc(boss.x+37,ground-145,28,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111";ctx.font="bold 18px sans-serif";ctx.fillText("王",boss.x+27,ground-137);ctx.fillStyle="#300";ctx.fillRect(boss.x-15,ground-190,110,10);ctx.fillStyle="#f44";ctx.fillRect(boss.x-15,ground-190,110*(boss.hp/boss.max),10)}
function loop(t){
 if(!started||over){draw();return}
 const dt=Math.min(.032,(t-last)/1000);last=t;update(dt);draw();raf=requestAnimationFrame(loop)
}
document.getElementById("jump").addEventListener("pointerdown",e=>{e.preventDefault();jump()});
document.getElementById("attack").addEventListener("pointerdown",e=>{e.preventDefault();attack()});
document.querySelectorAll(".card").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();setCard(+b.dataset.card);start()}));
document.getElementById("restart").addEventListener("click",resetGame);
canvas.addEventListener("pointerdown",()=>start());
addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp")jump();if(e.code==="KeyZ")attack()});
resize();resetGame();
</script>
</body>
</html>
