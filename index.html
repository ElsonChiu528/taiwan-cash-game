function say(t){msg.textContent=t;msg.classList.add('show');clearTimeout(window.mt);window.mt=setTimeout(()=>msg.classList.remove('show'),650)}
function setPan(v){pan=Math.max(-3,Math.min(3,v));img.style.transform=`translate(calc(-50% + ${pan}%),-50%) scale(1.02)`}
function move(d){
 pan += d*1.8; setPan(pan);
 img.animate([
  {transform:`translate(calc(-50% + ${pan-d*1.8}%),-50%) scale(1.02)`},
  {transform:`translate(calc(-50% + ${pan+d*.7}%),-50%) scale(1.02)`},
  {transform:`translate(calc(-50% + ${pan}%),-50%) scale(1.02)`}
 ],{duration:230,easing:'ease-out'});
 say(d<0?'◀ 向左移動':'向右移動 ▶');
}
function jump(){
 img.animate([
  {transform:`translate(calc(-50% + ${pan}%),calc(-50% - 0px)) scale(1.02)`},
  {transform:`translate(calc(-50% + ${pan}%),calc(-50% - 22px)) scale(1.035)`},
  {transform:`translate(calc(-50% + ${pan}%),-50%) scale(1.02)`}
 ],{duration:420,easing:'ease-out'});
 say('⬆️ 跳躍！');
}
function attack(){
 flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');
 say('💰 鈔票攻擊！');
}
function cards(){say('🃏 切換卡片：普卡 → 金卡 → 白金卡 → 黑卡')}
function point(e){
 const r=img.getBoundingClientRect();
 const x=(e.clientX-r.left)/r.width;
 const y=(e.clientY-r.top)/r.height;
 if(x<.16 && y>.70) return move(-1);
 if(x<.32 && y>.70) return move(1);
 if(x>.36 && x<.62 && y>.68) return cards();
 if(x>.78 && y>.67 && x<.92) return jump();
 if(x>=.92 && y>.67) return attack();
 // also allow wide tap zones on portrait iPad
 if(y>.72 && x<.25)return move(-1);
 if(y>.72 && x>.25 && x<.45)return move(1);
 if(y>.72 && x>.80)return attack();
}
touch.addEventListener('pointerdown',e=>{e.preventDefault();point(e)},{passive:false});
touch.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];point(t)},{passive:false});
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')move(-1);else if(e.key==='ArrowRight')move(1);
 else if(e.key==='ArrowUp'||e.key===' ')jump();else if(e.key.toLowerCase()==='z')attack();
});
document.getElementById('help').onclick=()=>panel.classList.add('show');
document.getElementById('close').onclick=()=>panel.classList.remove('show');
document.getElementById('test').onclick=()=>{panel.classList.remove('show');move(1);setTimeout(()=>move(-1),260)};
say('第一關：霸王炘｜點畫面下方按鈕即可操作');
</script>
</body>
</html>
