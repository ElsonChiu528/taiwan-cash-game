<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>台灣鈔能力：信義區突圍</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
body{touch-action:none}
#game{display:block;width:100vw;height:100vh;background:#6ea8d8}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff}
#top{position:absolute;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.panel{background:rgba(0,0,0,.58);backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:8px 11px;text-shadow:0 1px 2px #000}
#title{font-weight:900;font-size:15px}
#stats{font-size:13px;line-height:1.5;text-align:right}
#bossbar{display:none;position:absolute;left:12%;right:12%;top:78px;background:rgba(0,0,0,.65);padding:7px 9px;border-radius:12px}
#bossName{font-weight:900;font-size:13px;margin-bottom:4px}
.bar{height:10px;background:#3b1010;border-radius:99px;overflow:hidden}
#bossHp{height:100%;width:100%;background:linear-gradient(90deg,#ff2f2f,#ff9b2f)}
#hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.62);border-radius:16px;padding:14px 18px;text-align:center;font-size:14px;line-height:1.6;transition:opacity .4s}
#controls{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px}
.group{display:flex;gap:9px;pointer-events:auto}
.btn{width:66px;height:66px;border:1px solid rgba(255,255,255,.45);border-radius:50%;background:rgba(15,18,25,.62);color:#fff;font-size:25px;font-weight:900;box-shadow:0 5px 18px rgba(0,0,0,.28)}
.btn:active{transform:scale(.94);background:rgba(50,55,65,.85)}
.cardbtn{width:58px;height:58px;font-size:12px;border-radius:15px}
.cardbtn b{display:block;font-size:16px}
#restart{display:none;position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);pointer-events:auto;background:#fff;color:#111;border:0;border-radius:15px;padding:13px 22px;font-size:17px;font-weight:900;box-shadow:0 7px 24px rgba(0,0,0,.35)}
#message{position:absolute;left:50%;top:24%;transform:translateX(-50%);font-size:24px;font-weight:1000;text-shadow:0 3px 4px #000;white-space:nowrap}
@media(min-width:800px){.btn{width:72px;height:72px}.cardbtn{width:64px;height:64px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="top">
    <div class="panel"><div id="title">🇹🇼 台灣鈔能力：信義區突圍</div><div id="level">第一關・信義路</div></div>
    <div class="panel" id="stats">❤️ <span id="hp">5</span>　💰 <span id="money">0</span><br>🃏 <span id="card">普卡</span>　📍 <span id="distance">0</span>m</div>
  </div>
  <div id="bossbar"><div id="bossName">霸王炘・最終攔截</div><div class="bar"><div id="bossHp"></div></div></div>
  <div id="hint">自動向前奔跑<br>◀ 跳躍　▶ 出錢攻擊<br>下方四張卡可切換鈔能力</div>
  <div id="message"></div>
  <button id="restart">重新開始</button>
  <div id="controls">
    <div class="group">
      <button class="btn" id="jump">↟</button>
      <button class="btn" id="attack">💴</button>
    </div>
    <div class="group">
      <button class="btn cardbtn" data-card="0"><b>普</b>普卡</button>
      <button class="btn cardbtn" data-card="1"><b>金</b>金卡</button>
      <button class="btn cardbtn" data-card="2"><b>白</b>白金卡</button>
      <button class="btn cardbtn" data-card="3"><b>黑</b>黑卡</button>
    </div>
  </div>
</div>
<script>
"use strict";
const c=document.getElementById("game"),ctx=c.getContext("2d");
let W,H,dpr,ground;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+"px";c.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0);ground=H*.78}
addEventListener("resize",resize);resize();

const cards=[
 {name:"普卡",color:"#e8edf4",power:1,cool:340,speed:1},
 {name:"金卡",color:"#f4c542",power:1.7,cool:270,speed:1.05},
 {name:"白金卡",color:"#d9e7f2",power:2.5,cool:205,speed:1.12},
 {name:"黑卡",color:"#171b21",power:4,cool:150,speed:1.2}
];
let state;
function reset(){
 state={
  running:true,over:false,win:false,time:0,dist:0,hp:5,money:0,card:0,
  player:{x:W*.23,y:ground-78,vy:0,w:35,h:70,onGround:true,inv:0},
  scroll:0,spawn:0,attack:0,obstacles:[],projectiles:[],enemyShots:[],
  boss:null,bossSpawned:false,shake:0
 };
 document.getElementById("restart").style.display="none";
 document.getElementById("bossbar").style.display="none";
 document.getElementById("hint").style.opacity="1";
 document.getElementById("message").textContent="";
}
reset();

function rect(x,y,w,h,r=0){if(r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}else ctx.fillRect(x,y,w,h)}
function text(s,x,y,size,fill="#fff",align="left"){ctx.font=`900 ${size}px sans-serif`;ctx.fillStyle=fill;ctx.textAlign=align;ctx.fillText(s,x,y)}
function worldX(wx){return wx-state.scroll}

function drawSky(){
 const g=ctx.createLinearGradient(0,0,0,ground);g.addColorStop(0,"#65a5d8");g.addColorStop(.62,"#b7d5e8");g.addColorStop(1,"#e8d6bc");ctx.fillStyle=g;ctx.fillRect(0,0,W,ground);
 // distant Taipei skyline
 for(let i=-2;i<18;i++){
  const x=worldX(i*120), h=80+(i*37%130+130)%130;
  ctx.fillStyle=i%3===0?"#8b969c":"#9ca6a9";ctx.fillRect(x,ground-72-h,88,h+72);
  for(let yy=ground-50-h;yy<ground-88;yy+=22)for(let xx=x+10;xx<x+78;xx+=19){
   ctx.fillStyle="rgba(255,238,175,.65)";ctx.fillRect(xx,yy,9,8);
  }
 }
 // 101 silhouette when near finish
 if(state.dist>1300){
  const x=worldX(1510), y=ground-380;
  ctx.fillStyle="#536d7e";ctx.fillRect(x+32,y+130,60,250);
  for(let k=0;k<5;k++){ctx.fillStyle="#6f8998";ctx.fillRect(x+17-k*2,y+70+k*45,90+k*4,32)}
  ctx.fillStyle="#465e70";ctx.fillRect(x+52,y,20,70);text("101",x+62,y+110,22,"#fff","center");
 }
}
function drawStreet(){
 // shopfront row
 for(let i=-1;i<14;i++){
  const x=worldX(i*150);
  ctx.fillStyle=i%2?"#d6d0c5":"#b8c0c4";ctx.fillRect(x,ground-235,145,160);
  ctx.fillStyle=i%3?"#5e6770":"#d8a65d";ctx.fillRect(x+8,ground-205,129,76);
  ctx.fillStyle="#3b4145";ctx.fillRect(x+15,ground-190,42,52);
  ctx.fillStyle="#f4f0dd";ctx.fillRect(x+63,ground-190,66,52);
  text(i%2?"便利商店":"台灣小吃",x+72,ground-162,12,"#25313a","center");
  ctx.fillStyle="#b7b0a1";ctx.fillRect(x,ground-75,145,13);
  // awning
  ctx.fillStyle=i%2?"#ef4b45":"#4e91bd";ctx.fillRect(x,ground-220,145,15);
  for(let z=0;z<7;z++){ctx.fillStyle=z%2?"#fff":"rgba(255,255,255,.18)";ctx.fillRect(x+z*21,ground-220,10,15)}
 }
 // sidewalks / curb
 ctx.fillStyle="#b9b0a1";ctx.fillRect(0,ground-63,W,63);
 ctx.fillStyle="#777";ctx.fillRect(0,ground-7,W,7);
 ctx.fillStyle="#ddd";ctx.fillRect(0,ground-14,W,7);
 // road
 ctx.fillStyle="#45484a";ctx.fillRect(0,ground,W,H-ground);
 for(let i=-1;i<14;i++){const x=worldX(i*180);ctx.fillStyle="#e5d58d";ctx.fillRect(x,ground+62,88,5)}
 // zebra crossings
 for(let i=-1;i<9;i++){const x=worldX(i*330+210);for(let k=0;k<8;k++){ctx.fillStyle="#f2f2f2";ctx.fillRect(x+k*18,ground-48,11,48)}}
 // utility poles
 for(let i=-1;i<11;i++){const x=worldX(i*270+80);ctx.fillStyle="#555";ctx.fillRect(x,ground-310,8,250);ctx.fillStyle="#333";ctx.fillRect(x-28,ground-305,64,6);ctx.fillStyle="#222";ctx.fillRect(x-38,ground-292,84,3)}
}
function drawCars(){
 for(let i=0;i<7;i++){
  const x=worldX(i*390+130), y=ground+25+(i%2)*55;
  ctx.fillStyle=i%2?"#b73434":"#d8dadd";ctx.fillRect(x,y,92,31);ctx.fillStyle="#25282b";ctx.fillRect(x+18,y-17,50,20);
  ctx.fillStyle="#8fb4c8";ctx.fillRect(x+25,y-13,18,13);ctx.fillRect(x+46,y-13,18,13);
  ctx.fillStyle="#181818";ctx.beginPath();ctx.arc(x+18,y+31,9,0,7);ctx.arc(x+74,y+31,9,0,7);ctx.fill();
 }
 // scooters
 for(let i=0;i<9;i++){const x=worldX(i*230+70),y=ground-35;ctx.fillStyle="#25282b";ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.arc(x+32,y,9,0,7);ctx.fill();ctx.fillRect(x+8,y-17,25,6);ctx.fillRect(x+20,y-27,6,13)}
}
function drawTraffic(){
 const x=worldX(560);ctx.fillStyle="#555";ctx.fillRect(x,ground-280,8,220);ctx.fillStyle="#242424";ctx.fillRect(x-13,ground-276,34,85);
 ["#f33","#f5c84b","#37c65a"].forEach((col,i)=>{ctx.fillStyle=col;ctx.beginPath();ctx.arc(x+4,ground-258+i*25,7,0,7);ctx.fill()});
}

function drawPlayer(){
 const p=state.player, x=p.x,y=p.y;
 ctx.save();ctx.translate(x,y);
 // shadow
 ctx.fillStyle="rgba(0,0,0,.22)";ctx.beginPath();ctx.ellipse(0,74,25,7,0,0,7);ctx.fill();
 // legs
 ctx.strokeStyle="#18212a";ctx.lineWidth=7;ctx.lineCap="round";
 const run=Math.sin(state.time*.025)*10;ctx.beginPath();ctx.moveTo(-6,48);ctx.lineTo(-13+run,73);ctx.moveTo(7,48);ctx.lineTo(15-run,73);ctx.stroke();
 // body
 ctx.fillStyle="#315efb";ctx.fillRect(-15,16,30,35);
 // head
 ctx.fillStyle="#f1c49d";ctx.beginPath();ctx.arc(0,5,15,0,7);ctx.fill();
 ctx.fillStyle="#171717";ctx.beginPath();ctx.arc(0,-1,16,Math.PI,2*Math.PI);ctx.fill();
 // arm throwing money
 ctx.strokeStyle="#f1c49d";ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(12,23);ctx.lineTo(31,-1);ctx.stroke();
 ctx.fillStyle="#fff";ctx.fillRect(25,-7,22,13);ctx.strokeStyle="#2f8a55";ctx.lineWidth=1;ctx.strokeRect(25,-7,22,13);
 ctx.restore();
}
function drawObstacle(o){
 const x=o.x,y=o.y;
 if(o.type==="cone"){ctx.fillStyle="#f47b20";ctx.beginPath();ctx.moveTo(x,y+35);ctx.lineTo(x+18,y-4);ctx.lineTo(x+36,y+35);ctx.closePath();ctx.fill();ctx.fillStyle="#fff";ctx.fillRect(x+8,y+15,19,6)}
 else if(o.type==="barrier"){ctx.fillStyle="#e84b3c";ctx.fillRect(x,y,65,30);ctx.fillStyle="#fff";for(let k=0;k<4;k++)ctx.fillRect(x+k*18,y,8,30)}
 else {ctx.fillStyle="#30343a";ctx.fillRect(x,y,42,52);ctx.fillStyle="#f1c84b";ctx.fillRect(x+8,y+10,26,8);ctx.fillRect(x+8,y+34,26,8)}
}
function drawProjectile(q){
 ctx.save();ctx.translate(q.x,q.y);ctx.rotate(-.15);
 ctx.fillStyle=q.black?"#222":"#f6f0d4";ctx.fillRect(-18,-8,36,16);
 ctx.strokeStyle=q.black?"#fff":"#3d9c59";ctx.lineWidth=2;ctx.strokeRect(-18,-8,36,16);
 text("NT$",0,5,8,q.black?"#fff":"#23613a","center");ctx.restore();
}
function drawBoss(){
 if(!state.boss)return;const b=state.boss,x=b.x,y=b.y;
 // aura
 ctx.fillStyle="rgba(160,20,20,.18)";ctx.beginPath();ctx.arc(x,y+35,58+Math.sin(state.time*.02)*6,0,7);ctx.fill();
 ctx.fillStyle="#181b21";ctx.fillRect(x-23,y+12,46,60);
 ctx.fillStyle="#e4b58c";ctx.beginPath();ctx.arc(x,y,24,0,7);ctx.fill();
 ctx.fillStyle="#171717";ctx.beginPath();ctx.arc(x,y-8,25,Math.PI,2*Math.PI);ctx.fill();
 ctx.strokeStyle="#e4b58c";ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-0+x,y+27);ctx.lineTo(x-44,y+5);ctx.moveTo(x,y+28);ctx.lineTo(x+43,y+2);ctx.stroke();
 text("霸王炘",x,y-35,15,"#fff","center");
}
function collide(a,b){return a.x<a.x+a.w && a.x+a.w>b.x && a.y<a.y+a.h && a.y+a.h>b.y}
function hitPlayer(){if(state.player.inv>0)return;state.hp--;state.player.inv=120;state.shake=12;if(state.hp<=0)end(false)}
function end(win){state.running=false;state.over=true;state.win=win;document.getElementById("restart").style.display="block";document.getElementById("message").textContent=win?"🎉 突破成功！抵達台北101！":"💥 被霸王炘攔下了！";}

function spawnObstacle(){
 const types=["cone","barrier","sign"];
 const type=types[Math.floor(Math.random()*types.length)];
 state.obstacles.push({x:W+30,y:ground-38,w:type==="barrier"?65:42,h:type==="barrier"?30:50,type});
}
function fire(){
 if(!state.running)return;
 const card=cards[state.card];
 if(state.time-state.attack<card.cool)return;
 state.attack=state.time;
 state.projectiles.push({x:state.player.x+40,y:state.player.y+8,vx:8+card.speed*2,damage:card.power,black:state.card===3});
}
function jump(){
 if(!state.running)return;
 const p=state.player;if(p.onGround){p.vy=-15;p.onGround=false}
}
function setCard(i){if(state.running)state.card=i}

function update(){
 if(!state.running)return;
 state.time++;state.dist+=cards[state.card].speed*.72;
 state.scroll+=cards[state.card].speed*1.75;
 const p=state.player;
 if(p.inv>0)p.inv--;
 p.vy+=.72;p.y+=p.vy;
 if(p.y>=ground-78){p.y=ground-78;p.vy=0;p.onGround=true}
 state.spawn--;
 if(state.spawn<=0){spawnObstacle();state.spawn=65+Math.random()*65-(state.dist>600?18:0)}
 for(const o of state.obstacles)o.x-=cards[state.card].speed*2.1;
 for(const q of state.projectiles){q.x+=q.vx}
 for(const q of state.enemyShots){q.x-=q.vx}
 for(const o of state.obstacles){
   if(Math.abs(o.x-p.x)<42 && p.y+65>o.y && p.y<o.y+o.h)hitPlayer();
 }
 state.obstacles=state.obstacles.filter(o=>o.x>-100);
 state.projectiles=state.projectiles.filter(q=>q.x<W+100);

 if(!state.bossSpawned && state.dist>=1450){
  state.bossSpawned=true;state.boss={x:W-100,y:ground-95,hp:90,max:90,cool:70};
  document.getElementById("bossbar").style.display="block";
  document.getElementById("message").textContent="⚠️ 霸王炘出現！";
  setTimeout(()=>document.getElementById("message").textContent="",1600);
 }
 if(state.boss){
  const b=state.boss;
  b.x=Math.max(W*.58,b.x-0.35);
  const phase=b.hp/b.max;
  b.cool--;
  if(b.cool<=0){
    // harder: increasingly dense attacks at lower HP
    const count=phase>.66?1:phase>.33?2:3;
    for(let i=0;i<count;i++)state.enemyShots.push({x:b.x-35,y:b.y+20+i*18,vx:4.8+i*.5,w:22,h:12});
    b.cool=Math.max(24,70*phase);
  }
  for(const q of state.projectiles){
    if(Math.abs(q.x-b.x)<48 && Math.abs(q.y-(b.y+30))<70){b.hp-=q.damage; q.x=W+500}
  }
  for(const q of state.enemyShots){
    if(Math.abs(q.x-p.x)<34 && Math.abs(q.y-(p.y+30))<42){hitPlayer();q.x=-500}
  }
  state.enemyShots=state.enemyShots.filter(q=>q.x>-100);
  if(b.hp<=0){end(true)}
 }
 updateUI();
}
function updateUI(){
 document.getElementById("hp").textContent=Math.max(0,state.hp);
 document.getElementById("money").textContent=Math.floor(state.money);
 document.getElementById("card").textContent=cards[state.card].name;
 document.getElementById("distance").textContent=Math.floor(state.dist);
 if(state.boss)document.getElementById("bossHp").style.width=Math.max(0,state.boss.hp/state.boss.max*100)+"%";
}
function render(){
 ctx.save();
 if(state.shake){ctx.translate((Math.random()-.5)*state.shake,(Math.random()-.5)*state.shake);state.shake*=.88;if(state.shake<.2)state.shake=0}
 drawSky();drawStreet();drawCars();drawTraffic();
 for(const o of state.obstacles)drawObstacle(o);
 for(const q of state.projectiles)drawProjectile(q);
 for(const q of state.enemyShots){ctx.fillStyle="#ff4a35";ctx.beginPath();ctx.arc(q.x,q.y,7,0,7);ctx.fill()}
 drawBoss();
 if(!state.player.inv || Math.floor(state.player.inv/6)%2)drawPlayer();
 ctx.restore();
 requestAnimationFrame(render);
}
setInterval(update,1000/60);render();

function bind(id,fn){
 const el=document.getElementById(id);
 ["pointerdown","touchstart"].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();fn()},{passive:false}));
}
bind("jump",jump);bind("attack",fire);
document.querySelectorAll("[data-card]").forEach(b=>bind(b.id,()=>setCard(+b.dataset.card)));
document.getElementById("restart").addEventListener("click",reset);
addEventListener("keydown",e=>{
 if(e.code==="Space"||e.code==="ArrowUp")jump();
 if(e.code==="KeyF"||e.code==="ArrowRight")fire();
 if(/[1-4]/.test(e.key))setCard(+e.key-1);
});
setTimeout(()=>document.getElementById("hint").style.opacity="0",4500);
</script>
</body>
</html>
