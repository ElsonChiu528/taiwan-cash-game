<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>台灣鈔能力：信義區突圍｜手機順暢版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78add5}
body{touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
#game{display:block;width:100vw;height:100vh}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff}
.panel{background:rgba(0,0,0,.62);border-radius:12px;padding:7px 10px;text-shadow:0 1px 2px #000}
#top{position:absolute;top:max(8px,env(safe-area-inset-top));left:9px;right:9px;display:flex;justify-content:space-between;gap:6px}
#title{font-size:14px;font-weight:900}#level{font-size:12px;margin-top:2px}
#stats{font-size:12px;text-align:right;line-height:1.45}
#bossbar{display:none;position:absolute;top:76px;left:12%;right:12%;background:rgba(0,0,0,.7);padding:6px 8px;border-radius:10px}
#bossName{font-size:12px;font-weight:900}.bar{height:8px;background:#431414;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#ff5b35}
#hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.7);padding:12px 16px;border-radius:14px;text-align:center;font-size:13px;line-height:1.6;transition:opacity .3s}
#message{position:absolute;top:25%;left:50%;transform:translateX(-50%);font-size:22px;font-weight:900;white-space:nowrap;text-shadow:0 2px 4px #000}
#controls{position:absolute;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;padding:0 10px}
.group{display:flex;gap:7px;pointer-events:auto}
button{font-family:inherit;touch-action:manipulation}
.btn{width:62px;height:62px;border:1px solid rgba(255,255,255,.4);border-radius:50%;background:rgba(18,22,28,.72);color:#fff;font-size:24px;font-weight:900}
.card{width:55px;height:55px;border-radius:13px;font-size:11px}.card b{display:block;font-size:15px}
#restart{display:none;position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);pointer-events:auto;border:0;border-radius:13px;padding:12px 21px;background:#fff;color:#111;font-size:17px;font-weight:900}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="top">
    <div class="panel"><div id="title">🇹🇼 台灣鈔能力：信義區突圍</div><div id="level">第一關・信義路</div></div>
    <div class="panel" id="stats">❤️ <span id="hp">5</span>　💰 <span id="money">0</span><br>🃏 <span id="card">普卡</span>　📍 <span id="distance">0</span>m</div>
  </div>
  <div id="bossbar"><div id="bossName">霸王炘・最終攔截</div><div class="bar"><i id="bossHp"></i></div></div>
  <div id="hint">自動向前奔跑<br>↟ 跳躍　💴 出錢攻擊<br>下方四張卡可切換鈔能力</div>
  <div id="message"></div>
  <button id="restart">重新開始</button>
  <div id="controls">
    <div class="group"><button class="btn" id="jump">↟</button><button class="btn" id="attack">💴</button></div>
    <div class="group">
      <button class="btn card" data-card="0"><b>普</b>普卡</button>
      <button class="btn card" data-card="1"><b>金</b>金卡</button>
      <button class="btn card" data-card="2"><b>白</b>白金卡</button>
      <button class="btn card" data-card="3"><b>黑</b>黑卡</button>
    </div>
  </div>
</div>
<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d",{alpha:false});
let W=0,H=0,ground=0,scale=1,scene,sceneW=2200;

function resize(){
  W=Math.max(320,innerWidth||document.documentElement.clientWidth||320);
  H=Math.max(480,innerHeight||document.documentElement.clientHeight||480);
  ground=H*.78; scale=1;
  canvas.width=W; canvas.height=H; canvas.style.width="100vw"; canvas.style.height="100vh";
  buildScene();
  if(game){game.p.x=W*.23;game.p.y=ground-76;}
}
addEventListener("resize",resize);

const cards=[
 {name:"普卡",power:1,cool:18,speed:1},
 {name:"金卡",power:1.7,cool:14,speed:1.06},
 {name:"白金卡",power:2.5,cool:11,speed:1.12},
 {name:"黑卡",power:4,cool:8,speed:1.2}
];

function buildScene(){}


let game=null;
function reset(){
  game={
    running:true,over:false,win:false,t:0,dist:0,hp:5,money:0,card:0,
    scroll:0,cool:0,spawn:40,obstacles:[],shots:[],enemyShots:[],
    boss:null,bossSpawned:false,shake:0,
    p:{x:W*.23,y:ground-76,vy:0,onGround:true,inv:0}
  };
  document.getElementById("restart").style.display="none";
  document.getElementById("bossbar").style.display="none";
  document.getElementById("message").textContent="";
  updateUI();
}
function jump(){if(game&&game.running&&game.p.onGround){game.p.vy=-13;game.p.onGround=false}}
function fire(){
  if(!game||!game.running||game.cool>0)return;
  const c=cards[game.card];game.cool=c.cool;game.money+=5;
  game.shots.push({x:game.p.x+28,y:game.p.y+18,vx:8*c.speed,dmg:c.power});
}
function setCard(i){if(game)game.card=Math.max(0,Math.min(3,i));updateUI()}
function hit(){
  if(game.p.inv>0)return;
  game.hp--;game.p.inv=55;game.shake=5;
  if(game.hp<=0)end(false);
}
function end(win){
  if(!game.running)return;
  game.running=false;game.over=true;game.win=win;
  document.getElementById("restart").style.display="block";
  document.getElementById("message").textContent=win?"🎉 突破成功！抵達台北101！":"💥 被霸王炘攔下了！";
}
function spawnObstacle(){
  const types=["cone","barrier","sign"],type=types[Math.floor(Math.random()*3)];
  // All obstacles stay low enough to clear with a normal jump.
  const h=type==="barrier"?24:type==="sign"?34:28;
  game.obstacles.push({x:W+30,y:ground-63-h,w:type==="barrier"?65:type==="sign"?42:36,h,type});
}
function update(){
  if(!game.running)return;
  game.t++;const c=cards[game.card];
  game.dist+=.72*c.speed;game.scroll+=1.75*c.speed;
  const p=game.p;
  if(p.inv>0)p.inv--;
  p.vy+=.62;p.y+=p.vy;
  if(p.y>=ground-76){p.y=ground-76;p.vy=0;p.onGround=true}
  game.cool=Math.max(0,game.cool-1);
  game.spawn--;if(game.spawn<=0){spawnObstacle();game.spawn=95+Math.random()*65}
  for(const o of game.obstacles)o.x-=2.1*c.speed;
  for(const s of game.shots)s.x+=s.vx;
  for(const s of game.enemyShots)s.x-=s.vx;

  // Forgiving collision box: only the player's lower body needs to overlap.
  for(const o of game.obstacles)
    if(Math.abs(o.x-p.x)<36 && p.y+68>o.y+5 && p.y+18<o.y+o.h)hit();
  game.obstacles=game.obstacles.filter(o=>o.x>-100);
  game.shots=game.shots.filter(s=>s.x<W+100);

  if(!game.bossSpawned&&game.dist>=1450){
    game.bossSpawned=true;game.boss={x:W-95,y:ground-98,hp:90,max:90,cool:55};
    document.getElementById("bossbar").style.display="block";
    document.getElementById("message").textContent="⚠️ 霸王炘出現！";
    setTimeout(()=>{if(game&&game.running)document.getElementById("message").textContent=""},1400);
  }
  if(game.boss){
    const b=game.boss;b.x=Math.max(W*.58,b.x-.3);b.cool--;
    for(const s of game.shots)
      if(Math.abs(s.x-b.x)<48&&Math.abs(s.y-(b.y+35))<75){b.hp-=s.dmg;s.x=W+500}
    if(b.cool<=0){
      const phase=b.hp/b.max,n=phase>.66?1:phase>.33?2:3;
      for(let i=0;i<n;i++)game.enemyShots.push({x:b.x-35,y:b.y+20+i*18,vx:4.5+i*.5});
      b.cool=Math.max(25,68*phase);
    }
    for(const s of game.enemyShots)
      if(Math.abs(s.x-p.x)<35&&Math.abs(s.y-(p.y+30))<44){hit();s.x=-500}
    game.enemyShots=game.enemyShots.filter(s=>s.x>-100);
    if(b.hp<=0)end(true);
  }
  updateUI();
}
function updateUI(){
  if(!game)return;
  document.getElementById("hp").textContent=game.hp;
  document.getElementById("money").textContent=Math.floor(game.money);
  document.getElementById("card").textContent=cards[game.card].name;
  document.getElementById("distance").textContent=Math.floor(game.dist);
  if(game.boss) document.getElementById("bossHp").style.width=Math.max(0,game.boss.hp/game.boss.max*100)+"%";
}

function drawPlayer(){
  const p=game.p,x=p.x,y=p.y;
  ctx.save();ctx.translate(x,y);
  // shadow
  ctx.fillStyle="rgba(0,0,0,.22)";ctx.beginPath();ctx.ellipse(0,72,23,6,0,0,7);ctx.fill();
  // legs
  ctx.strokeStyle="#18212a";ctx.lineWidth=7;ctx.lineCap="round";
  const r=Math.sin(game.t*.3)*9;
  ctx.beginPath();ctx.moveTo(-6,47);ctx.lineTo(-13+r,73);ctx.moveTo(7,47);ctx.lineTo(15-r,73);ctx.stroke();
  // body/head
  ctx.fillStyle="#315efb";ctx.fillRect(-15,16,30,35);
  ctx.fillStyle="#f1c49d";ctx.beginPath();ctx.arc(0,5,15,0,7);ctx.fill();
  ctx.fillStyle="#171717";ctx.beginPath();ctx.arc(0,-1,16,Math.PI,2*Math.PI);ctx.fill();
  // arm + banknote
  ctx.strokeStyle="#f1c49d";ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(12,23);ctx.lineTo(31,-1);ctx.stroke();
  ctx.fillStyle="#fff";ctx.fillRect(25,-7,22,13);ctx.strokeStyle="#2f8a55";ctx.lineWidth=1;ctx.strokeRect(25,-7,22,13);
  ctx.restore();
}
function drawBoss(){
  if(!game.boss)return;
  const b=game.boss,x=b.x,y=b.y;
  ctx.fillStyle="rgba(120,0,0,.18)";ctx.beginPath();ctx.arc(x,y+35,72,0,7);ctx.fill();
  ctx.fillStyle="#8d1f2d";ctx.fillRect(x-34,y+25,68,58);
  ctx.fillStyle="#f0bd94";ctx.beginPath();ctx.arc(x,y+7,29,0,7);ctx.fill();
  ctx.fillStyle="#1a1a1a";ctx.beginPath();ctx.arc(x,y-1,30,Math.PI,2*Math.PI);ctx.fill();
  ctx.fillStyle="#f5d04a";ctx.fillRect(x-30,y+52,60,25);
  ctx.fillStyle="#111";ctx.font="900 11px sans-serif";ctx.textAlign="center";ctx.fillText("霸王炘",x,y+70);
}
function draw(){
  if(!game)return;
  ctx.setTransform(1,0,0,1,0,0);
  // Sky
  ctx.fillStyle="#79acd3";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#b9d6e6";ctx.fillRect(0,ground-210,W,210);
  // Distant buildings
  for(let i=0;i<10;i++){
    const x=((i*170-game.scroll*.18)%1800)-100;
    const h=70+(i%4)*35;
    ctx.fillStyle=i%2?"#9ca7aa":"#89969c";ctx.fillRect(x,ground-65-h,110,h+65);
  }
  // Shops
  for(let i=0;i<9;i++){
    const x=((i*180-game.scroll*.55)%1620)-180;
    ctx.fillStyle=i%2?"#d5d0c6":"#b8c0c4";ctx.fillRect(x,ground-225,170,150);
    ctx.fillStyle=i%2?"#e84d45":"#4d91bb";ctx.fillRect(x,ground-214,170,16);
    ctx.fillStyle="#4b555b";ctx.fillRect(x+12,ground-190,62,55);
    ctx.fillStyle="#eee7d3";ctx.fillRect(x+83,ground-190,70,55);
    ctx.fillStyle="#263039";ctx.font="900 12px sans-serif";ctx.textAlign="center";
    ctx.fillText(i%2?"便利商店":"台灣小吃",x+85,ground-158);
  }
  // Sidewalk / curb / road
  ctx.fillStyle="#b9b09f";ctx.fillRect(0,ground-63,W,63);
  ctx.fillStyle="#777";ctx.fillRect(0,ground-8,W,8);
  ctx.fillStyle="#ddd";ctx.fillRect(0,ground-15,W,7);
  ctx.fillStyle="#45484a";ctx.fillRect(0,ground,W,H-ground);
  ctx.fillStyle="#e5d58d";
  for(let x=(-game.scroll%210)-100;x<W+210;x+=210)ctx.fillRect(x,ground+62,90,5);
  // Zebra crossings
  ctx.fillStyle="#f4f4f4";
  for(let x=(-game.scroll%430)-40;x<W+430;x+=430)
    for(let k=0;k<7;k++)ctx.fillRect(x+k*20,ground-48,12,48);
  // Utility poles
  for(let x=(-game.scroll%310)-80;x<W+310;x+=310){
    ctx.fillStyle="#555";ctx.fillRect(x,ground-290,8,230);
    ctx.fillStyle="#333";ctx.fillRect(x-28,ground-286,64,6);
  }
  // Traffic light
  const tx=((560-game.scroll*.75)% (W+300)+W+300)%(W+300)-150;
  ctx.fillStyle="#555";ctx.fillRect(tx,ground-270,8,210);
  ctx.fillStyle="#222";ctx.fillRect(tx-13,ground-265,34,82);
  ctx.fillStyle="#f33";ctx.beginPath();ctx.arc(tx+4,ground-247,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f5c84b";ctx.beginPath();ctx.arc(tx+4,ground-222,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#37c65a";ctx.beginPath();ctx.arc(tx+4,ground-197,7,0,Math.PI*2);ctx.fill();
  // Cars
  for(let i=0;i<5;i++){
    const x=((100+i*300-game.scroll*.9)%(W+360)+W+360)%(W+360)-180;
    const y=ground+25+(i%2)*54;
    ctx.fillStyle=i%2?"#b73535":"#d5d7d9";ctx.fillRect(x,y,90,30);
    ctx.fillStyle="#25282b";ctx.fillRect(x+18,y-16,50,19);
    ctx.fillStyle="#8fb4c8";ctx.fillRect(x+25,y-13,18,13);ctx.fillRect(x+46,y-13,18,13);
    ctx.fillStyle="#181818";ctx.beginPath();ctx.arc(x+18,y+30,9,0,Math.PI*2);ctx.arc(x+73,y+30,9,0,Math.PI*2);ctx.fill();
  }
  // Taipei 101
  if(game.dist>1250){
    const x=W*.72;
    ctx.fillStyle="#526d7e";ctx.fillRect(x+25,ground-330,55,330);
    for(let k=0;k<5;k++){ctx.fillStyle="#6f8998";ctx.fillRect(x+10-k*2,ground-315+k*48,85+k*4,28)}
    ctx.fillStyle="#fff";ctx.font="900 20px sans-serif";ctx.textAlign="center";ctx.fillText("101",x+52,ground-220);
  }
  // Obstacles
  for(const o of game.obstacles){
    ctx.fillStyle=o.type==="cone"?"#f47b20":o.type==="barrier"?"#e84b3c":"#30343a";
    if(o.type==="cone"){ctx.beginPath();ctx.moveTo(o.x,o.y+35);ctx.lineTo(o.x+18,o.y-4);ctx.lineTo(o.x+36,o.y+35);ctx.closePath();ctx.fill()}
    else ctx.fillRect(o.x,o.y,o.w,o.h);
  }
  // Player projectiles
  for(const q of game.shots){
    ctx.fillStyle=game.card===3?"#222":"#f5f0d4";ctx.fillRect(q.x,q.y,32,14);
    ctx.strokeStyle="#2f8a55";ctx.strokeRect(q.x,q.y,32,14);
  }
  // Enemy projectiles
  ctx.fillStyle="#ff4735";
  for(const q of game.enemyShots){ctx.beginPath();ctx.arc(q.x,q.y,7,0,Math.PI*2);ctx.fill()}
  drawBoss();
  if(!game.p.inv||Math.floor(game.p.inv/6)%2)drawPlayer();
}
function loop(){
  const now=performance.now();
  if(!loop.last)loop.last=now;
  const dt=Math.min(50,now-loop.last);loop.last=now;
  loop.acc=(loop.acc||0)+dt;
  while(loop.acc>=16.67){update();loop.acc-=16.67}
  draw();requestAnimationFrame(loop);
}

document.getElementById("jump").onclick=jump;
document.getElementById("attack").onclick=fire;
document.querySelectorAll(".card").forEach(b=>b.onclick=()=>setCard(+b.dataset.card));
document.getElementById("restart").onclick=()=>{reset();loop.last=performance.now();loop.acc=0};
addEventListener("keydown",e=>{
  if(e.code==="Space"||e.code==="ArrowUp")jump();
  if(e.code==="ArrowRight"||e.code==="KeyF")fire();
  if(/^[1-4]$/.test(e.key))setCard(+e.key-1);
});

resize();reset();
addEventListener("orientationchange",()=>setTimeout(resize,150));
addEventListener("pageshow",()=>setTimeout(resize,50));
setTimeout(()=>document.getElementById("hint").style.opacity="0",4200);
requestAnimationFrame(loop);
</script>
</body>
</html>
