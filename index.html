function size(){W=innerWidth;H=innerHeight;ground=H*.61;c.width=W;c.height=H;resetP();draw()}addEventListener("resize",size);
function resetP(){P.x=W*.18;P.y=ground-P.h;P.vy=0;P.on=true}
function reset(){level=1;dist=money=0;hp=5;sel=0;world=cd=0;obs=[];coins=[];shots=[];boss=null;over=run=false;resetP();document.getElementById("hint").style.opacity=1;document.getElementById("restart").style.display="none";ui();draw()}
function start(){if(over)return;if(!run){run=true;document.getElementById("hint").style.opacity=0;last=performance.now();requestAnimationFrame(loop)}}
function jump(){start();if(P.on){P.vy=-760;P.on=false}}
function atk(){start();if(cd>0)return;let q=cards[sel];cd=q[2];shots.push({x:P.x+P.w,y:P.y+30,v:8*q[1],pow:q[1],life:1})}
function spawn(){Math.random()<.45?coins.push({x:W+30,y:ground-90-Math.random()*130}):obs.push({x:W+30,y:ground-44,w:35+Math.random()*25,h:44+Math.random()*25})}
function update(dt){let speed=245;world+=speed*dt;dist=Math.floor(world/10);cd=Math.max(0,cd-dt*1000);P.vy+=1900*dt;P.y+=P.vy*dt;if(P.y+P.h>=ground){P.y=ground-P.h;P.vy=0;P.on=true}st-=dt;if(st<=0){spawn();st=.7+Math.random()*.65}obs.forEach(o=>o.x-=speed*dt);coins.forEach(o=>o.x-=speed*dt);shots.forEach(s=>{s.x+=s.v*60*dt;s.life-=dt});obs=obs.filter(o=>o.x>-80);coins=coins.filter(o=>o.x>-60);shots=shots.filter(s=>s.life>0&&s.x<W+100);
for(const o of obs)if(o.x<P.x+P.w-5&&o.x+o.w>P.x+5&&P.y+P.h>o.y){if(!P.inv){hp--;P.inv=true;setTimeout(()=>P.inv=false,650)}o.x=-200}for(const q of coins)if(Math.hypot(q.x-P.x-23,q.y-P.y-37)<43){money+=10;q.x=-100}
if(dist>450&&level<3){level++;world=dist=0;show(level==2?"第二關・桃園市":"第三關・新竹縣")}if(dist>450&&level==3){level=4;world=dist=0;boss={x:W+180,hp:30,max:30};show("👑 王關・霸王煩")}if(level==4&&boss){boss.x=Math.max(W*.62,boss.x-120*dt);for(const s of shots)if(Math.abs(s.x-boss.x)<100){boss.hp-=s.pow;s.life=0}if(boss.hp<=0){over=true;show("🎉 打倒霸王煩！");document.getElementById("restart").style.display="block"}}if(hp<=0){over=true;show("挑戰失敗");document.getElementById("restart").style.display="block"}ui()}
function show(t){document.getElementById("msg").textContent=t;setTimeout(()=>{if(!over)document.getElementById("msg").textContent=""},1500)}
function ui(){hpEl.textContent=hp;moneyEl.textContent=money;distEl.textContent=dist;cardEl.textContent=cards[sel][0];lv.textContent=["第一關・信義路","第二關・桃園市","第三關・新竹縣","👑 王關・霸王煩"][level-1]}
function city(){let g=x.createLinearGradient(0,0,0,ground);g.addColorStop(0,"#62a8e8");g.addColorStop(1,"#dff2ff");x.fillStyle=g;x.fillRect(0,0,W,ground);for(let i=0;i<9;i++){let bx=i*120-world*.08%120,bh=170+(i%4)*55;x.fillStyle=["#d9e5eb","#b9d3df","#e5edf0"][i%3];x.fillRect(bx,ground-bh,90,bh);x.fillStyle="#67acd8";for(let y=ground-bh+20;y<ground-20;y+=34)for(let xx=bx+12;xx<bx+78;xx+=27)x.fillRect(xx,y,15,19)}for(let i=0;i<7;i++){let tx=i*140-world*.18%140;x.fillStyle="#70482f";x.fillRect(tx,ground-135,10,135);x.fillStyle="#36a94b";x.beginPath();x.arc(tx+5,ground-150,45,0,7);x.fill()}x.fillStyle="#234c72";x.fillRect(W*.48,ground-245,W*.4,70);x.fillStyle="#fff";x.font="bold 27px sans-serif";x.fillText(level==1?"台北・信義區":level==2?"桃園市":level==3?"新竹縣":"👑 王關",W*.51,ground-200)}
function player(){let X=P.x,Y=P.y;x.fillStyle="#f2b48b";x.beginPath();x.arc(X+23,Y+18,18,0,7);x.fill();x.fillStyle="#1970e8";x.fillRect(X+5,Y+34,36,31);x.strokeStyle="#17202a";x.lineWidth=8;x.beginPath();x.moveTo(X+14,Y+62);x.lineTo(X+5,Y+73);x.moveTo(X+31,Y+62);x.lineTo(X+41,Y+73);x.stroke();x.strokeStyle="#f2b48b";x.beginPath();x.moveTo(X+36,Y+41);x.lineTo(X+61,Y+27);x.stroke()}
function drawBoss(){let bw=Math.min(W*.43,360),bh=bw*1.12;x.drawImage(bossImg,boss.x-bw*.05,ground-bh-12,bw,bh);x.fillStyle="#250000";x.fillRect(boss.x-10,ground-bh-30,Math.min(bw*1.15,300),13);x.fillStyle="#ff3030";x.fillRect(boss.x-10,ground-bh-30,Math.min(bw*1.15,300)*(boss.hp/boss.max),13);x.fillStyle="#fff";x.font="bold 22px sans-serif";x.fillText("👑 霸王煩",boss.x,ground-bh-40)}
function draw(){x.clearRect(0,0,W,H);city();x.fillStyle="#c3c3c1";x.fillRect(0,ground,W,H-ground);for(let i=-1;i<W/70+1;i++){x.fillStyle=i%2?"#eee":"#aaa";x.fillRect(i*70-world/2%70,ground,34,70)}x.fillStyle="#4d5963";x.fillRect(0,ground+70,W,H-ground-70);x.fillStyle="#eee";for(let i=-1;i<W/350+2;i++)x.fillRect(i*350-world%350,ground+270,180,13);obs.forEach(o=>{x.fillStyle="#303840";x.fillRect(o.x,o.y,o.w,o.h)});coins.forEach(q=>{x.fillStyle="#d9efb8";x.fillRect(q.x-22,q.y-15,44,30);x.fillStyle="#31894c";x.font="bold 25px sans-serif";x.fillText("$",q.x-8,q.y+9)});shots.forEach(s=>{x.fillStyle="#eaffae";x.fillRect(s.x,s.y,32,12);x.fillStyle="#25884b";x.font="bold 16px sans-serif";x.fillText("$",s.x+9,s.y+10)});player();if(boss)drawBoss()}
function loop(t){if(!run||over){draw();return}let dt=Math.min(.032,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
const hpEl=document.getElementById("hp"),moneyEl=document.getElementById("money"),distEl=document.getElementById("dist"),cardEl=document.getElementById("card"),lv=document.getElementById("lv");
document.getElementById("jump").addEventListener("pointerdown",e=>{e.preventDefault();jump()});document.getElementById("atk").addEventListener("pointerdown",e=>{e.preventDefault();atk()});document.querySelectorAll(".card").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();sel=+b.dataset.i;start();ui()}));document.getElementById("restart").onclick=reset;addEventListener("keydown",e=>{if(e.code=="Space"||e.code=="ArrowUp")jump();if(e.code=="KeyZ")atk()});c.addEventListener("pointerdown",start);size();reset();
</script></body></html>
